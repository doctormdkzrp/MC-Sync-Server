plugins {
    id "java"
    id "com.gradleup.shadow" version "8.3.5"
}

group = "com.mcsync"
version = "0.3.0"

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation "com.eclipsesource.minimal-json:minimal-json:0.9.5"

    testImplementation "org.junit.jupiter:junit-jupiter-api:5.8.2", "org.junit.jupiter:junit-jupiter-params:5.8.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.8.2", "com.eclipsesource.minimal-json:minimal-json:0.9.5", "org.junit.platform:junit-platform-launcher"
}

jar {
    enabled = false
}

tasks.named("assemble") {
    dependsOn tasks.named("shadowJar")
}

test {
    useJUnitPlatform()
}

shadowJar {
    // 文件名保持 gtnh-sync-agent.jar：客户端两台的 -javaagent: 参数不用改。
    archiveBaseName = "gtnh-sync-agent"
    archiveFileName = "gtnh-sync-agent.jar"
    archiveClassifier = ""

    manifest {
        attributes "Premain-Class": "com.superzanti.serversync.agent.SyncAgent"
        attributes "Agent-Class": "com.superzanti.serversync.agent.SyncAgent"
        attributes "Can-Redefine-Classes": "false"
        attributes "Can-Retransform-Classes": "false"
    }
}
